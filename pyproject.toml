[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archguard-ai"
version = "0.1.0"
description = "Traceable AI-assisted architecture verification prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "PyYAML>=6", "pydantic>=2.5", "requests>=2.31"]

[tool.setuptools.packages.find]
include = ["archguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
